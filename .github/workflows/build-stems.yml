name: Build and publish (4-stem)

# One manual workflow for every desktop platform CI can build. Both builds feed
# a single publish job, so a release is updated once and the README download
# table is regenerated once - no two workflows racing on main.
#
# Leave `release_tag` empty for a build-only run (artifacts, no release).
# macOS is still built locally; see docs/releases.md.
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to create/update (empty = build only)"
        type: string
        default: ""
      build_windows:
        description: "Build the Windows x64 zip"
        type: boolean
        default: true
      build_linux:
        description: "Build the Linux .deb"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: build-stems-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Windows
  # ---------------------------------------------------------------------------
  windows:
    if: ${{ inputs.build_windows }}
    runs-on: windows-2022
    timeout-minutes: 150
    env:
      BUILDENV_BASEPATH: C:\buildenv
      BUILDENV_RELEASE: "TRUE"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up CMake
        uses: jwlawson/actions-setup-cmake@v2.2
        with:
          cmake-version: "3.21.x"

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Set up Mixxx build environment (vcpkg deps)
        shell: cmd
        run: tools\windows_buildenv.bat setup

      # Mixxx's CMake falls back to downloading ONNX Runtime itself, which is
      # broken on Windows with CMake 3.21 ("At least one entry of URL is a
      # path"). Fetch it here and hand CMake explicit paths instead.
      - name: Fetch ONNX Runtime
        shell: pwsh
        run: |
          $ver = "1.19.2"
          $name = "onnxruntime-win-x64-$ver"
          $zip = "$env:RUNNER_TEMP\$name.zip"
          Invoke-WebRequest -Uri "https://github.com/microsoft/onnxruntime/releases/download/v$ver/$name.zip" -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath "$env:RUNNER_TEMP\ort" -Force
          $root = "$env:RUNNER_TEMP\ort\$name"
          if (-not (Test-Path "$root\include\onnxruntime_cxx_api.h")) { throw "ORT headers missing" }
          if (-not (Test-Path "$root\lib\onnxruntime.lib")) { throw "ORT import library missing" }
          "ORT_ROOT=$root" >> $env:GITHUB_ENV
          Write-Host "ONNX Runtime staged at $root"

      - name: Configure
        shell: pwsh
        run: |
          cmake -S . -B build `
            -DCMAKE_BUILD_TYPE=RelWithDebInfo `
            -DCMAKE_PREFIX_PATH="$env:CMAKE_PREFIX_PATH" `
            -DONNXRUNTIME_INCLUDE_DIR="$env:ORT_ROOT\include" `
            -DONNXRUNTIME_LIBRARY="$env:ORT_ROOT\lib\onnxruntime.lib" `
            -DMIXXX_AUTO_DOWNLOAD_ONNX=OFF `
            -DQT6=ON `
            -DQML=OFF `
            -DBUILD_TESTING=OFF `
            -DBUILD_BENCH=OFF `
            -DWARNINGS_FATAL=OFF `
            -DVCPKG_TARGET_TRIPLET=x64-windows-release `
            -DBULK=ON -DFFMPEG=OFF -DHSS1394=ON -DLOCALECOMPARE=ON -DMAD=ON `
            -DMEDIAFOUNDATION=ON -DMODPLUG=ON -DWAVPACK=ON `
            -DKEYFINDER=ON -DOPUS=ON -DVINYLCONTROL=ON -DHID=ON -DLILV=ON

      - name: Build
        shell: pwsh
        run: cmake --build build --config RelWithDebInfo --parallel

      - name: Stage portable build (exe + res + DLLs + models)
        shell: pwsh
        run: |
          cmake --install build --config RelWithDebInfo --prefix stage

          # ONNX Runtime is linked via rpath/import lib; the DLL is not part of
          # Mixxx's install rules, so copy it next to the executable.
          $ortDll = "$env:ORT_ROOT\lib\onnxruntime.dll"
          if (Test-Path $ortDll) {
            Copy-Item $ortDll stage\
            Write-Host "bundled onnxruntime.dll"
          } else {
            throw "onnxruntime.dll not found in $env:ORT_ROOT"
          }

          # fdk-aac is loaded at runtime with QLibrary, not linked.
          $fdk = Get-ChildItem "$env:MIXXX_VCPKG_ROOT\installed\x64-windows-release\bin\fdk-aac*.dll" -ErrorAction SilentlyContinue
          if ($fdk) {
            Copy-Item $fdk.FullName stage\
            Write-Host "bundled $($fdk.Name)"
          }

          # Spleeter 4-stem models, fetched at build time (not stored in git).
          New-Item -ItemType Directory -Force stage\models | Out-Null
          $base = "https://huggingface.co/Best-Practice/spleeter-4stems-onnx/resolve/main"
          foreach ($stem in @("vocals", "drums", "bass", "other")) {
            $out = "stage\models\spleeter_$stem.onnx"
            Write-Host "downloading $stem.onnx"
            Invoke-WebRequest -Uri "$base/$stem.onnx" -OutFile $out
            if ((Get-Item $out).Length -lt 10MB) { throw "model $stem looks truncated" }
          }

          Copy-Item README.md stage\README-mixxx-stems.md -ErrorAction SilentlyContinue
          Compress-Archive -Path stage\* -DestinationPath mixxx-stems-windows-x64.zip -Force
          Get-Item mixxx-stems-windows-x64.zip | Format-List Name, Length

      - name: Upload zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: mixxx-stems-windows-x64
          path: mixxx-stems-windows-x64.zip
          retention-days: 14
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Linux
  # ---------------------------------------------------------------------------
  linux:
    if: ${{ inputs.build_linux }}
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    env:
      BUILDENV_BASEPATH: /home/runner/buildenv
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Our STFT frontend links FFTW3f (single precision). Debian/Ubuntu ship it
      # in libfftw3-dev, but without an FFTW3f CMake config (CMakeLists falls
      # back to find_library).
      - name: Install FFTW and packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libfftw3-dev dpkg-dev

      - name: Set up Mixxx build environment
        run: tools/debian_buildenv.sh setup

      - name: Fetch Spleeter models
        run: |
          mkdir -p models
          base="https://huggingface.co/Best-Practice/spleeter-4stems-onnx/resolve/main"
          for stem in vocals drums bass other; do
            echo "downloading $stem.onnx"
            curl -fL --retry 3 "$base/$stem.onnx" -o "models/spleeter_$stem.onnx"
            size=$(stat -c%s "models/spleeter_$stem.onnx")
            if [ "$size" -lt 10000000 ]; then
              echo "model $stem looks truncated ($size bytes)"; exit 1
            fi
          done
          ls -lh models/

      - name: Configure
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DQT6=ON \
            -DQML=OFF \
            -DBUILD_TESTING=OFF \
            -DBUILD_BENCH=OFF \
            -DWARNINGS_FATAL=OFF \
            -DBULK=ON \
            -DFFMPEG=OFF \
            -DLOCALECOMPARE=ON \
            -DMAD=ON \
            -DMODPLUG=ON \
            -DWAVPACK=ON \
            -DINSTALL_USER_UDEV_RULES=OFF

      - name: Build
        run: cmake --build build --parallel "$(nproc)"

      - name: Package .deb
        run: |
          cd build
          cpack -G DEB
          ls -lh ./*.deb

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: mixxx-stems-linux-deb
          path: build/*.deb
          retention-days: 14
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Publish once, for whatever was built successfully
  # ---------------------------------------------------------------------------
  publish:
    needs: [windows, linux]
    # `!cancelled()` keeps this running when one platform was skipped/failed,
    # as long as the other produced an artifact.
    if: ${{ !cancelled() && inputs.release_tag != '' && (needs.windows.result == 'success' || needs.linux.result == 'success') }}
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - name: Download Windows zip
        if: ${{ needs.windows.result == 'success' }}
        uses: actions/download-artifact@v4
        with:
          name: mixxx-stems-windows-x64
          path: dist

      - name: Download Linux deb
        if: ${{ needs.linux.result == 'success' }}
        uses: actions/download-artifact@v4
        with:
          name: mixxx-stems-linux-deb
          path: dist

      - name: Ensure the release exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.release_tag }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            echo "creating release $TAG"
            gh release create "$TAG" \
              --title "$TAG" \
              --prerelease \
              --notes "Automated build of Mixxx 2.5.6 with Spleeter 4-stem separation. Install instructions and credits: see the README."
          fi

      - name: Attach assets to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ls -lh dist/
          gh release upload "${{ inputs.release_tag }}" dist/* --clobber

  # ---------------------------------------------------------------------------
  # Regenerate the README download table from the release's assets
  # ---------------------------------------------------------------------------
  sync-downloads:
    needs: publish
    if: ${{ inputs.release_tag != '' }}
    uses: ./.github/workflows/sync-downloads.yml
    with:
      tag: ${{ inputs.release_tag }}
    permissions:
      contents: write

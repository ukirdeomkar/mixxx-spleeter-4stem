name: Linux build (4-stem)

# Manual only (plus release tags). Produces a .deb that already contains the
# four Spleeter models in /usr/share/mixxx/models.
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

concurrency:
  group: linux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    env:
      BUILDENV_BASEPATH: /home/runner/buildenv
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Our STFT frontend links FFTW3f (single precision). Debian/Ubuntu ship it
      # in libfftw3-dev together with FFTW3fConfig.cmake.
      - name: Install FFTW and packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libfftw3-dev dpkg-dev

      - name: Set up Mixxx build environment
        run: tools/debian_buildenv.sh setup

      - name: Fetch Spleeter models
        run: |
          mkdir -p models
          base="https://huggingface.co/Best-Practice/spleeter-4stems-onnx/resolve/main"
          for stem in vocals drums bass other; do
            echo "downloading $stem.onnx"
            curl -fL --retry 3 "$base/$stem.onnx" -o "models/spleeter_$stem.onnx"
            size=$(stat -c%s "models/spleeter_$stem.onnx")
            if [ "$size" -lt 10000000 ]; then
              echo "model $stem looks truncated ($size bytes)"; exit 1
            fi
          done
          ls -lh models/

      - name: Configure
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DQT6=ON \
            -DQML=OFF \
            -DBUILD_TESTING=OFF \
            -DBUILD_BENCH=OFF \
            -DWARNINGS_FATAL=OFF \
            -DBULK=ON \
            -DFFMPEG=OFF \
            -DLOCALECOMPARE=ON \
            -DMAD=ON \
            -DMODPLUG=ON \
            -DWAVPACK=ON \
            -DINSTALL_USER_UDEV_RULES=OFF

      - name: Build
        run: cmake --build build --parallel "$(nproc)"

      - name: Package .deb
        run: |
          cd build
          cpack -G DEB
          ls -lh ./*.deb

      - name: Upload .deb
        uses: actions/upload-artifact@v4
        with:
          name: mixxx-stems-linux-deb
          path: build/*.deb
          retention-days: 14
          if-no-files-found: error
